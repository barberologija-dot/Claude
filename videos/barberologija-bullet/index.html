<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #efede7; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.8" data-width="1080" data-height="1920">
      <div id="el-main" class="scene" data-composition-id="main-shot" data-composition-src="compositions/main-shot.html" data-start="0" data-duration="17.0" data-track-index="0"></div>
      <div id="el-phone" class="scene" data-composition-id="phone" data-composition-src="compositions/phone.html" data-start="17.0" data-duration="4.4" data-track-index="1"></div>
      <div id="el-end" class="scene" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="21.4" data-duration="2.4" data-track-index="0"></div>
      <audio id="a-sound" src="assets/sound-design.mp3" data-start="0" data-duration="23.8" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 23.8 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
